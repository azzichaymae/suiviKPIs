<!DOCTYPE html>
<html>
<head>
  {% load static %}
  <title>Suivi hebdomadaire des KPIs</title>
 <link rel="icon"  href="{% static 'favicon.ico' %}">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1500px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #2c3e50 0%, #1f4788 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
    }

    .content {
      padding: 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      color: #2c3e50;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input[type="file"],
    input[type="date"],
    select {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .file-section {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .file-section label {
      display: inline-block;
      width: 220px;
      font-weight: 600;
      color: #2c3e50;
      vertical-align: middle;
    }

    .file-section input[type="file"] {
      display: inline-block;
      vertical-align: middle;
      margin-bottom: 10px;
    }

    .button-container {
      text-align: right;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #e0e0e0; /* neutral gray */
      color: #2c3e50;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Suivi hebdomadaire des KPIs</h1>
    </div>
    
    {% if alerts %}
 <div style="background:#ffe0e0; padding:10px; border:1px solid #cc0000; margin:20px; border-radius:6px;">
<div style="display:flex; justify-content:space-between; align-items:center; background:#f8d7da; padding:12px 10px;">
    <h4 style="color:#a94442; font-weight:500; margin:0;">🔴 ANOMALIES DÉTECTÉES ({{ alerts|length }})</h4>
    <a style="color:#a94442; font-weight:600; cursor:pointer;" href="{% url 'upload_excel' %}" >Corriger</a>
  </div>  <ul style="list-style-type:none; margin-left: 20px;">
    {% for alert in alerts %}
      <li>{{ alert }}</li>
    {% endfor %}
  </ul>
   
</div>

{% else %}
<div class="content">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-row">
          <div class="form-group">
            <label for="date_from">Date de début:</label>
            <input type="date" name="date_from" id="date_from" required>
          </div>
          <div class="form-group">
            <label for="date_to">Date de fin:</label>
            <input type="date" name="date_to" id="date_to" required>
          </div>
          <div class="form-group">
            <label for="department">Département:</label>
            <select name="departement" id="departement" required>
              <option value="">-- Sélectionnez une département --</option>
                            <option value="Global">Global</option>

              <option value="Production">Production</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Securité">Securité</option>
              <option value="Securité">Qualité</option>
            </select>
          </div>
        </div>

        <div class="file-section">
          <label for="vpc_file">VPC/CVPC Excel:</label>
          <input type="file" name="file_vpc" id="vpc_file" ><br>

          <label for="bog_file">BOG Excel:</label>
          <input type="file" name="file_bog" id="bog_file" ><br>

          <label for="overdue_file">Overdue Actions Excel:</label>
          <input type="file" name="overdue_file" id="overdue_file" ><br>

          <label for="std">Situations dangereuses Excel:</label>
          <input type="file" name="std_file" id="std" >
        </div>

        <div class="button-container">
          <button type="submit">Générer Rapport</button>
        </div>
      </form>
    </div>
    {% endif %}
  </div>
</body>
</html>
